name: GeoGroup

options:
  bundleIdPrefix: com.geogroup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 mode: nothing the Kotlin framework exports is Sendable, so Swift 6
    # strict concurrency is all noise here.
    SWIFT_VERSION: "5.0"
    # Xcode's script sandbox blocks Gradle from writing into shared/build.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  GeoGroup:
    type: application
    platform: iOS
    sources:
      - path: GeoGroup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geogroup.app
        PRODUCT_NAME: GeoGroup
        INFOPLIST_FILE: GeoGroup/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Gradle writes the framework into a per-configuration, per-SDK directory.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ONLY_ACTIVE_ARCH: NO
    preBuildScripts:
      - name: Build Kotlin Shared Framework
        path: Scripts/build-shared-framework.sh
        # Gradle does its own up-to-date checking.
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
